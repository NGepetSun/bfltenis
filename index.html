<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BFL Tennis • Live Bracket</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="bg"></div><div class="scan"></div><div class="particles"></div>
  <header class="top">
    <a class="brand" href="/" aria-label="BFL Tennis home"><img src="/bfl-logo.png" alt="BFL"><div><b>BFL TENNIS</b><span>LIVE TOURNAMENT</span></div></a>
    <div class="top-actions"><span id="topStatus" class="top-status">● OFFLINE</span><a class="admin-link" href="/admin.html">ADMIN</a></div>
  </header>

  <main>
    <section class="bracket-section glass section">
      <div class="section-title hero-title"><div><span class="eyebrow">TOURNAMENT</span><h1>LIVE <em>BRACKET</em></h1></div><span id="updated">—</span></div>
      <div id="bracket" class="bracket-wrap"><div class="empty">Menghubungkan ke turnamen...</div></div>
    </section>

    <section class="live-section glass section">
      <div class="section-title"><div><span class="eyebrow">WATCH NOW</span><h2>LIVE STREAM</h2></div><span id="statusText" class="status-badge">CONNECTING...</span></div>
      <div id="court" class="court"><div class="empty">Belum ada live streaming.</div></div>
    </section>

    <section class="compact-info">
      <div class="info glass"><small>PRIZE POOL</small><strong>Rp 1.000.000</strong></div>
      <div class="info glass"><small>1ST</small><strong>Rp 500.000</strong></div>
      <div class="info glass"><small>2ND</small><strong>Rp 300.000</strong></div>
      <div class="info glass"><small>3RD</small><strong>Rp 200.000</strong></div>
    </section>

    <section class="glass section podium-section">
      <div class="section-title"><h2>PODIUM</h2><span>FINAL RESULT</span></div>
      <div id="podium" class="podium"></div>
    </section>
  </main>
  <footer>© BROTHER FOR LIFE • GTA V ROLEPLAY</footer>
  <script src="/app.js"></script>
</body>
</html>
